<!doctype html>
<html lang="fr">
<head>

<title>Où est Anna ?</title>
<meta name="description" content="Le planning d'Anna, tenu à jour par Marie et Raph.">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<style>
/* ================================================================
   PALETTE
   ================================================================ */
:root{
  --bg:#f6f6f4; --card:#ffffff; --ink:#1b1b19; --ink-2:#5c5c56; --ink-3:#8c8c84;
  --line:#e3e3dd; --line-2:#eeeee8; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.14);
  --marie:#1b5fa8; --raph:#bf2318; --tous:#7a2e9e; --gp:#2f7a4d; --def:#7a7a72;
  --marie-bg:#e7f0fa; --raph-bg:#fbebe9; --tous-bg:#f3eafa; --gp-bg:#e8f3ec; --def-bg:#efefea;
  --lieu-base:#0e8fa0; --lieu-paris:#c2700a; --lieu-out:#c4147a;
  --bar-bg:rgba(246,246,244,.93);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121211; --card:#1c1c1a; --ink:#f0f0ec; --ink-2:#a8a8a0; --ink-3:#7a7a72;
    --line:#2e2e2b; --line-2:#262624; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    --marie:#79b4f0; --raph:#f0857a; --tous:#c79ae8; --gp:#5cc98a; --def:#9a9a92;
    --marie-bg:#16263a; --raph-bg:#33201d; --tous-bg:#281a33; --gp-bg:#152a1f; --def-bg:#262623;
    --lieu-base:#4fc3d4; --lieu-paris:#e5a463; --lieu-out:#f37ac0;
    --bar-bg:rgba(18,18,17,.93);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--ink);
  font:400 16px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:0 0 4rem;
}
.wrap{max-width:44rem;margin:0 auto;padding:0 1rem}

/* ---------------- en-tête ---------------- */
header{padding:2.2rem 0 1.1rem}
h1{font-size:1.5rem;line-height:1.15;letter-spacing:-.02em;margin:0 0 .3rem;font-weight:650}
.sub{color:var(--ink-3);font-size:.82rem;margin:0}
.maj{margin-top:.12rem}
.maj:empty{display:none}

/* ---------------- carte "maintenant" ---------------- */
.now{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:1.15rem 1.25rem;box-shadow:var(--shadow);margin:0 0 1.4rem;
}
.now .lab{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 .5rem}
.now .who{font-size:1.5rem;font-weight:650;letter-spacing:-.02em;margin:0;line-height:1.2}
.now .where{font-size:1rem;color:var(--ink-2);margin:.15rem 0 0}
.now .note{font-size:.85rem;color:var(--ink-3);margin:.55rem 0 0;font-style:italic}
.now .until{font-size:.8rem;color:var(--ink-3);margin:.6rem 0 0;padding-top:.6rem;border-top:1px solid var(--line-2)}
.now .goto{margin:.6rem 0 0}
.now .goto button{
  font:inherit;font-size:.78rem;padding:.3rem .7rem;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--bg);color:var(--ink-2);
}

/* ---------------- barre d'outils collante ---------------- */
.tools{
  position:sticky;top:0;z-index:20;
  background:var(--bar-bg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  margin:0 -1rem 1.1rem;padding:.6rem 1rem .5rem;
}
.search{position:relative;margin:0 0 .45rem}
.search input{
  width:100%;font:inherit;font-size:1rem;padding:.5rem .8rem .5rem 2.15rem;
  background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;
  -webkit-appearance:none;appearance:none;
}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:none;border-color:var(--ink-3)}
.search svg{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);
  width:.9rem;height:.9rem;stroke:var(--ink-3);fill:none;stroke-width:2;pointer-events:none}
.search button{position:absolute;right:.45rem;top:50%;transform:translateY(-50%);
  border:0;background:var(--line-2);color:var(--ink-2);border-radius:50%;
  width:1.35rem;height:1.35rem;font-size:.9rem;line-height:1;cursor:pointer;padding:0}
.frow{display:flex;align-items:center;gap:.3rem;overflow-x:auto;scrollbar-width:none;
  padding:.11rem 0;-webkit-overflow-scrolling:touch}
.frow::-webkit-scrollbar{display:none}
.frow > b{
  flex:0 0 auto;font-size:.62rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);width:4.4rem;
}
.frow button{
  flex:0 0 auto;font:inherit;font-size:.74rem;padding:.22rem .58rem;border-radius:999px;
  cursor:pointer;background:var(--card);border:1px solid var(--line);color:var(--ink-2);
  white-space:nowrap;
}
.frow button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:640px){
  .frow{-webkit-mask-image:linear-gradient(to right,#000 88%,transparent);
        mask-image:linear-gradient(to right,#000 88%,transparent)}
}

/* ---------------- lignes ---------------- */
h2{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;margin:1.4rem 0 .7rem}
.list{display:flex;flex-direction:column;gap:.4rem}
.row{
  display:flex;gap:.85rem;align-items:flex-start;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:.7rem .85rem;scroll-margin-top:var(--bar-h,9.5rem);
}
.row.past{opacity:.42}
.row.ici{border-color:var(--c,var(--ink-3));box-shadow:0 0 0 1px var(--c,var(--ink-3))}
.row .bar{width:3px;border-radius:3px;align-self:stretch;flex:0 0 3px;background:var(--c,var(--def))}
.row .body{flex:1;min-width:0}
.row .when{font-size:.8rem;font-weight:600;color:var(--ink);margin:0 0 .15rem;
  font-variant-numeric:tabular-nums}
.row .who{font-size:1rem;font-weight:600;margin:0;letter-spacing:-.01em;color:var(--c,var(--ink))}
.row .who .at{font-weight:400;color:var(--ink-2)}
.at-base{color:var(--lieu-base)!important}
.at-paris{color:var(--lieu-paris)!important}
.at-out{color:var(--lieu-out)!important}
.row .note{font-size:.8rem;color:var(--ink-3);margin:.2rem 0 0}
.tag{
  flex:0 0 auto;font-size:.66rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  padding:.2rem .45rem;border-radius:6px;align-self:center;white-space:nowrap;
  background:var(--cb,var(--def-bg));color:var(--c,var(--def));
}
.tag.jour{background:var(--ink);color:var(--bg)}
.m-marie{--c:var(--marie);--cb:var(--marie-bg)}
.m-raph{--c:var(--raph);--cb:var(--raph-bg)}
.m-tous{--c:var(--tous);--cb:var(--tous-bg)}
.m-gp{--c:var(--gp);--cb:var(--gp-bg)}
.m-def{--c:var(--def);--cb:var(--def-bg);font-style:italic}
.m-def .note,.m-def .when{font-style:normal}
.fleche{color:var(--ink-3);font-weight:400}

/* ---------------- abonnement au calendrier ---------------- */
.expbar{display:flex;flex-direction:column;gap:.32rem;margin:.2rem 0 .3rem}
.expbar button[hidden],.expbar p[hidden]{display:none}
.expbar p{margin:0;font-size:.72rem;line-height:1.4;color:var(--ink-3);text-align:center}
/* ---------------- fenêtre d'abonnement ---------------- */
.voile{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;padding:1rem;overflow:auto}
.abo{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:1.15rem;width:min(30rem,100%);max-height:90vh;overflow:auto}
.abo h3{margin:0 0 .7rem;font-size:.95rem}
.abo p{margin:0 0 .6rem;font-size:.8rem;line-height:1.5;color:var(--ink-2)}
.abo .quoi{background:var(--line-2);border-radius:10px;padding:.6rem .7rem;color:var(--ink)}
.abo .avert{color:var(--ink-3);font-size:.75rem}
.abo .alerte{background:var(--raph-bg);color:var(--raph);border-radius:10px;
  padding:.55rem .7rem;font-size:.78rem;font-weight:500}
.abo .alerte[hidden]{display:none}
.abo .actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.9rem}
.abo .actions button{font:inherit;font-size:.8rem;font-weight:600;padding:.55rem .8rem;
  border-radius:10px;cursor:pointer;border:1px solid var(--line);background:transparent;
  color:var(--ink-2)}
.abo .actions .fort{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:1}
.abo .actions button:hover{border-color:var(--ink-3)}
.abo .etapes{border:1px solid var(--line);border-radius:12px;padding:.7rem .75rem;margin-top:.9rem}
.abo .etapes .titre{margin:0 0 .5rem;font-size:.7rem;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-3)}
.abo .ongs{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.6rem}
.abo .ong{font:inherit;font-size:.72rem;font-weight:600;padding:.28rem .55rem;border-radius:999px;
  cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--ink-3)}
.abo .ong.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.abo ol.pas{margin:0;padding-left:1.15rem;font-size:.78rem;line-height:1.5;color:var(--ink-2)}
.abo ol.pas li{margin:.28rem 0}
.abo ol.pas[hidden]{display:none}
.abo #abo-u{width:100%;box-sizing:border-box;margin-top:.7rem;font-family:ui-monospace,
  SFMono-Regular,Menlo,monospace;font-size:.7rem;padding:.45rem .5rem;border-radius:8px;
  border:1px solid var(--line);background:var(--line-2);color:var(--ink-2)}
.abo .deja{font-size:.75rem;color:var(--ink-3);border-top:1px solid var(--line);
  margin-top:.9rem;padding-top:.7rem}
.abo .deja b{display:block;color:var(--ink-2);font-weight:600;margin-bottom:.25rem}
.abo code{font-size:.7rem;word-break:break-all;background:var(--line-2);
  padding:.1rem .25rem;border-radius:4px}
.expbar button{
  flex:1;font:inherit;font-size:.8rem;font-weight:600;padding:.52rem .8rem;border-radius:10px;
  cursor:pointer;background:var(--card);border:1px solid var(--line);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;gap:.45rem;
}
.expbar button:hover,.expbar button:active{background:var(--line-2);color:var(--ink)}
.expbar svg{width:.95rem;height:.95rem;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round}

/* ---------------- bandeau « et maintenant ? » ---------------- */
.toast{
  position:fixed;bottom:.75rem;left:50%;transform:translateX(-50%);z-index:50;
  width:min(34rem,calc(100% - 1.5rem));background:var(--ink);color:var(--bg);
  border-radius:12px;padding:.7rem .5rem .7rem .85rem;font-size:.8rem;line-height:1.45;
  box-shadow:0 8px 28px rgba(0,0,0,.28);display:flex;gap:.5rem;align-items:flex-start;
}
.toast p{margin:0;flex:1}
.toast button{
  flex:0 0 auto;font:inherit;font-size:1.1rem;line-height:1;padding:.1rem .4rem;
  background:none;border:0;color:inherit;opacity:.6;cursor:pointer;
}
.toast button:hover{opacity:1}

/* ---------------- mois ---------------- */
.month{margin:1.5rem 0 .5rem;font-size:.95rem;font-weight:650;letter-spacing:-.01em;
  scroll-margin-top:var(--bar-h,9.5rem)}

/* ---------------- pied ---------------- */
footer{margin-top:2.4rem;padding-top:1.2rem;border-top:1px solid var(--line);
  font-size:.75rem;color:var(--ink-3);line-height:1.6}
.legend{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 .9rem}
.legend span{font-size:.68rem;font-weight:600;padding:.2rem .45rem;border-radius:6px}

/* ---------------- états ---------------- */
.msg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.25rem;
  font-size:.88rem;line-height:1.65;color:var(--ink-2)}
.msg h3{margin:0 0 .6rem;font-size:.95rem;color:var(--ink)}
.msg code{background:var(--line-2);padding:.1rem .3rem;border-radius:4px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82em;word-break:break-all}
.msg ol{margin:.5rem 0 0;padding-left:1.2rem} .msg li{margin:.35rem 0}
.empty{color:var(--ink-3);font-size:.88rem;padding:1.1rem 0;margin:0}
.porte{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:1.5rem 1.35rem;box-shadow:var(--shadow);max-width:24rem;margin:1rem auto}
.porte p{margin:0 0 1rem;font-size:.88rem;color:var(--ink-2);line-height:1.6}
.porte label{display:block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 .35rem}
.porte input{width:100%;font:inherit;font-size:1rem;padding:.6rem .8rem;border-radius:10px;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);
  -webkit-appearance:none;appearance:none}
.porte input:focus{outline:none;border-color:var(--ink-3)}
.porte .bt{width:100%;margin-top:.8rem;font:inherit;font-size:.95rem;font-weight:600;
  padding:.62rem;border-radius:10px;cursor:pointer;border:0;background:var(--ink);color:var(--bg)}
.porte .bt[disabled]{opacity:.55;cursor:default}
.porte .err{color:var(--raph);font-size:.82rem;margin:.7rem 0 0;min-height:1.2em}
.oubli{display:inline;border:0;background:none;padding:0;font:inherit;font-size:inherit;
  color:var(--ink-3);text-decoration:underline;cursor:pointer}
.skel{height:1rem;background:var(--line-2);border-radius:5px;animation:p 1.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.5}50%{opacity:.9}}
</style>
</head>

<script>

   1. CONFIGURATION
   ==================================================================
   Adresse CSV publiée de l'onglet « Données web ».
   Google Sheets : Fichier → Partager → Publier sur le web
     · Onglet : « Données web »   · Format : .csv
   ================================================================== */
const CSV_URL = "";

/* Secours : identifiant du tableur tel qu'il apparaît dans l'adresse d'édition
   https://docs.google.com/spreadsheets/d/CET_IDENTIFIANT/edit#gid=1504266455
   Le tableur doit alors être partagé en « Tout utilisateur disposant du lien — Lecteur ». */

const SCRIPT_URL = "";

   de la reconstituer. Mettre alors CSV_URL à "".
   QUESTION est l'indice affiché au visiteur (« Quel est le nom de son doudou ? ») :
   il reste en clair, c'est voulu.
   Ces lignes se fabriquent avec « Reglages.html », qui régénère un index.html
   complet — à garder sur votre ordinateur (ne pas le déposer sur GitHub).
   ------------------------------------------------------------------ */
const COFFRE = "v2.300000.kwx4esZ5HweFQ5S18141JA==.6+baKaIiB02QU5vz.6auhsYSQnrnjlh7Bm4QtMLJlspn1OrjL2a5fKxyBBkDDv3GFTu55G8r0eZK5f8uVO3aiasKokJKOyRMkzxuEGNCySzIejw54NLhY4kYwDZUs1aFBVUk806YCBZcPgVa+mUUPrZSzkDxDiwARzxfwo2C11GaKonA4kkr7i9r4PNzk6JPZ4bO+ffXpdrg0qMHJUL+a159/nd/5lrHr5nrwkSQ4ICl7u5HNNnXp7ZsFIT9m4aJW4pztjpUFeLcnEZNLOUSibJMuXYid0gkl1uAU70oc5PaCQ011+hiNZAnvlE96xqy5RZfDBP/YjjS64tDkUdI1xxllQIByn++YQHPOSRW+kpHio05KX6Hh9RnEopNAHzRiWP/VUbtSb2gn2WmfMtiV/9hBaBwDcw==";

/* ------------------------------------------------------------------ */
const P = new URLSearchParams(location.search);

/* >>> LOGIQUE PARTAGÉE — engendré, ne pas modifier ici <<< */
/* ==================================================================
   LOGIQUE PARTAGÉE — version 3.2
   ------------------------------------------------------------------
   Ce bloc est IDENTIQUE, au caractère près, dans Pre-index.html et dans

   dans logique.js, puis régénérer les deux ensemble.

   C'est ce qui empêche la page et le calendrier de raconter deux

   ================================================================== */
const VERSION = "3.2";

const JOURS = {lun:"lundi",mar:"mardi",mer:"mercredi",jeu:"jeudi",ven:"vendredi",sam:"samedi",dim:"dimanche"};
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MOIS_C = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];

const CLASSE = {"Marie":"m-marie","Raph":"m-raph","Tous les 3":"m-tous","Autres":"m-gp","À définir":"m-def"};
const LIBELLE = {"Marie":"Avec Marie","Raph":"Avec Raph","Tous les 3":"Tous les 3",
                 "Autres":"Autres","À définir":"À définir"};
const BASE = "Corenc", PARIS = "Paris", NONDEF = "À définir";

/* Un nom saisi librement (« Lydia », « Grands-parents ») est compté dans « Autres »
   par le tableur : la page doit le colorer pareil, en vert, et non en gris. */
function classeQui(q){
  if(!q) return "m-def";
  return CLASSE[q] || CLASSE["Autres"];
}
function categorieQui(q){ return CLASSE[q] ? q : "Autres"; }
function classeLieu(o){
  if(!o || o===NONDEF) return "";
  if(o===BASE) return "at-base";
  if(o===PARIS) return "at-paris";
  return "at-out";
}
function categorieLieu(o){
  if(o===BASE) return "Corenc";
  if(o===PARIS) return "Paris";
  if(o===NONDEF) return NONDEF;
  return "Autres";
}
function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- CSV ---------- */
function parseCSV(t){
  t = t.replace(/^\uFEFF/,"");
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){
      if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else if(c==='"') q=true;
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else if(c!=="\r") cur+=c;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(v=>v.trim()!==""));
}
function toObjects(rows){
  const h = rows[0].map(s=>s.trim());
  const ix = n => h.indexOf(n);
  const iD=ix("Date"), iJ=ix("Jour"), iQ=ix("Avec qui ?"), iO=ix("Où ça ?"),
        iC=ix("Commentaire"), iT=ix("Type");
  const iM = ix("Mise à jour");
  if(iD<0||iQ<0) throw new Error("colonnes introuvables");
  const days = rows.slice(1).map(r=>({
    date:(r[iD]||"").trim(), jour:(r[iJ]||"").trim(), qui:(r[iQ]||"").trim(),
    ou:(r[iO]||"").trim(), com:(r[iC]||"").trim(), typ:(r[iT]||"").trim()
  })).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d.date));
  // colonne facultative « Mise à jour » : horodatage écrit par le tableur à chaque modification
  let maj = null;
  if(iM >= 0){
    for(const r of rows.slice(1)){
      const d = litDate(r[iM]);
      if(d){ maj = d; break; }
    }
  }
  return {days, maj};
}

/* ---------- dates ---------- */
function dparts(s){ const [y,m,j]=s.split("-").map(Number); return {y,m:m-1,j}; }
function jourNum(s){ return Math.round(Date.parse(s+"T12:00:00Z")/86400000); }
function libelleDate(s,court){
  const {y,m,j}=dparts(s);
  const jj = new Date(Date.UTC(y,m,j)).getUTCDay();
  const noms=["dim","lun","mar","mer","jeu","ven","sam"];
  return `${court?noms[jj]:JOURS[noms[jj]]} ${j===1?"1er":j} ${court?MOIS_C[m]:MOIS[m]}`;
}
function libellePeriode(b){
  const a=dparts(b.debut), z=dparts(b.fin);
  if(b.debut===b.fin) return cap(libelleDate(b.debut));
  const an = (z.y!==a.y) ? " "+z.y : "";
  return `${cap(libelleDate(b.debut,true))} → ${libelleDate(b.fin,true)}${an}`;
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* Le tableur peut écrire l'horodatage en ISO ou au format français. On teste le format
   français d'abord : « 12/03/2027 » serait sinon lu comme le 3 décembre par le navigateur. */
function litDate(v){
  if(!v) return null;
  const m = String(v).trim().match(
    /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ ,]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1], +(m[4]||0), +(m[5]||0), +(m[6]||0));
  return isNaN(Date.parse(v)) ? null : new Date(v);
}

/* ==================================================================
   2. REGROUPEMENT
   Deux lectures du même planning :
   · « complet »     — tous les jours, coupés quand change (avec qui, où, vacances ou non)
   · « remarquable » — seulement ce qui sort d'une journée d'école ordinaire
   ================================================================== */
function notable(d){
  if(d.typ !== "classe") return true;
  if(d.qui === NONDEF && d.ou === NONDEF) return false;
  return d.qui !== "Marie" || d.ou !== BASE;
}

function grouper(days, cleFn, gardeFn){
  const out=[]; let cur=null;
  const ajoute = (b,com) => {
    if(!com) return;
    for(const part of com.split(" – ")){
      const t=part.trim();
      if(t && !b.notes.includes(t)) b.notes.push(t);
    }
  };
  for(const d of days){
    if(gardeFn && !gardeFn(d)){ cur=null; continue; }
    const key = cleFn(d);
    if(cur && cur.key===key && jourNum(d.date)===jourNum(cur.fin)+1){
      cur.fin=d.date; cur.jours.push(d); ajoute(cur,d.com);
    } else {
      cur={key, qui:d.qui, ou:d.ou, notes:[], debut:d.date, fin:d.date, jours:[d]};
      ajoute(cur,d.com);
      out.push(cur);
    }
  }
  for(const b of out){
    const n = b.jours.length>1 ? b.notes.filter(t=>!/\(férié\)$/.test(t)) : b.notes;
    b.notesToutes = b.notes;
    b.com = n.slice(0,3).join(" · ") + (n.length>3 ? " · …" : "");
    b.types = new Set(b.jours.map(d=>d.typ));
    const a=dparts(b.debut), z=dparts(b.fin);
    b.hay = norm([LIBELLE[b.qui]||b.qui, b.qui, b.ou, b.notesToutes.join(" "), libellePeriode(b),
                  MOIS[a.m]+" "+a.y, MOIS[z.m]+" "+z.y,
                  ...b.jours.map(d=>d.typ+" "+(JOURS[d.jour]||d.jour)),
                  b.ou===NONDEF?"lieu a definir":""].join(" "));
  }
  return out;
}

/* Trajets : chaque changement de lieu entre deux périodes consécutives.
   · le lieu précédent est Corenc            -> Aller   (date : 1er jour du séjour)
   · le lieu suivant est Corenc              -> Retour  (date : dernier jour du séjour)
   · ni l'un ni l'autre n'est Corenc         -> Transit (une seule ligne, deux dates possibles) */
function trajetsDepuis(complets){
  const out=[];
  for(let i=0;i<complets.length-1;i++){
    const a=complets[i], b=complets[i+1];
    if(a.ou === b.ou) continue;                       // même lieu : pas de trajet
    if(a.ou === BASE && b.ou === BASE) continue;
    let sens, date, date2=null, quis, ous, note, couleur;
    let brute, jours, passation=false;   // « brute » : la note sans échappement HTML, pour le .ics
    if(a.ou === BASE){
      sens="Aller";  date=b.debut; quis=[b.qui]; ous=[b.ou];
      brute = LIBELLE[b.qui]||b.qui; couleur = classeQui(b.qui);
      jours = [b.jours[0]];
    } else if(b.ou === BASE){
      sens="Retour"; date=a.fin;   quis=[a.qui]; ous=[a.ou];
      brute = LIBELLE[a.qui]||a.qui; couleur = classeQui(a.qui);
      jours = [a.jours[a.jours.length-1]];
    } else {
      sens="Transit"; date=a.fin; date2=b.debut; quis=[a.qui,b.qui]; ous=[a.ou,b.ou];
      brute = a.qui===b.qui ? (LIBELLE[a.qui]||a.qui)
            : `Passation : ${a.qui} → ${b.qui}`;
      // passation entre deux personnes : on ne sait pas de qui est le trajet -> violet
      couleur = a.qui===b.qui ? classeQui(a.qui) : "m-tous";
      jours = [a.jours[a.jours.length-1], b.jours[0]];
      passation = a.qui !== b.qui;
    }
    note = esc(brute);
    out.push({sens, date, date2, de:a.ou, vers:b.ou, quis, ous, note, brute, jours, passation,
      couleur,
      hay: norm([sens, a.ou, b.ou, a.qui, b.qui, LIBELLE[a.qui]||"", LIBELLE[b.qui]||"", note,
                 libelleDate(date), date2?libelleDate(date2):"",
                 MOIS[dparts(date).m]+" "+dparts(date).y,
                 a.notesToutes.join(" "), b.notesToutes.join(" ")].join(" "))});
  }
  return out.sort((x,y)=> x.date<y.date?-1:1);
}
/* ==================================================================
   FABRICATION DU FICHIER iCalendar (RFC 5545)
   ================================================================== */
function icsTexte(s){
  return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;")
                  .replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
}
/* Longueur en octets d'une chaîne UTF-8, comptée à la main.
   TextEncoder, l'outil habituel, n'existe pas dans Apps Script : s'en servir
   faisait échouer le calendrier avec « TextEncoder is not defined ». Le calcul
   ci-dessous marche des deux côtés, ce qui est tout l'intérêt du bloc partagé. */
function octets(s){
  let n = 0;
  for(const ch of s){
    const c = ch.codePointAt(0);
    n += c < 0x80 ? 1 : c < 0x800 ? 2 : c < 0x10000 ? 3 : 4;
  }
  return n;
}
/* RFC 5545 : 75 octets par ligne, les suivantes commencent par une espace. */
function plier(ligne){
  let out = "", cur = "", n = 0, limite = 75;
  for(const ch of ligne){
    const o = octets(ch);
    if(n + o > limite){
      out += (out ? "\r\n" : "") + cur;
      cur = " "; n = 1; limite = 74;
    }
    cur += ch; n += o;
  }
  return out + (out ? "\r\n" : "") + cur;
}
function jourPlus(iso, n){
  const d = new Date(iso + "T12:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0,10);
}
const compact = iso => iso.replace(/-/g,"");
/* Calculé à l'appel : côté script, le fichier est refabriqué à chaque requête. */
function horodatage(){ return new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,""); }

function evenement({debut, fin, titre, lieu, note, cle}){
  const L = ["BEGIN:VEVENT",
    "UID:" + cle.replace(/[^a-zA-Z0-9-]/g,"_") + "@ou-est-anna",
    "DTSTAMP:" + horodatage(),
    "DTSTART;VALUE=DATE:" + compact(debut),
    "DTEND;VALUE=DATE:" + compact(jourPlus(fin, 1)),
    "SUMMARY:" + icsTexte(titre)];
  if(lieu) L.push("LOCATION:" + icsTexte(lieu));
  if(note) L.push("DESCRIPTION:" + icsTexte(note));
  L.push("TRANSP:TRANSPARENT", "END:VEVENT");
  return L;
}

function avecQui(q){
  if(!q || q === NONDEF) return "";
  return q === "Tous les 3" ? "Marie et Raph" : q;
}
/* Le lieu n'est pas dans le titre : il va dans le champ « Lieu » de l'évènement,
   ce qui évite d'avoir à choisir entre « à Paris », « au Cap-Vert » et « dans le
   Vercors » — le français n'a pas de règle là-dessus. */
/* On n'ajoute au calendrier que ce qui est arrêté. Un évènement « à définir »
   n'apprend rien à personne, et il faudrait aller le corriger à la main dans le
   calendrier une fois la case remplie — c'est pire que de ne rien ajouter. */
function defini(v){ return !!v && v !== NONDEF; }
function exportable(x, trajets){
  return trajets ? (defini(x.de) && defini(x.vers) && x.quis.every(defini))
                 : (defini(x.qui) && defini(x.ou));
}

function titrePeriode(b){
  const qui = avecQui(b.qui);
  return qui ? `Anna avec ${qui}` : "Anna (avec qui à définir)";
}
/* Un lieu vide laisserait le champ muet, alors que c'est justement ce qu'il faut
   remarquer : on l'écrit en toutes lettres. */
function lieuEvenement(ou){
  return (ou && ou !== NONDEF) ? ou : "Lieu à définir";
}
function titreTrajet(t){
  const nom = o => o === NONDEF ? "lieu à définir" : o;
  const a = avecQui(t.quis[0]), z = avecQui(t.quis[t.quis.length-1]);
  // passation vers quelqu'un d'encore inconnu : le dire, plutôt que de laisser
  // croire que la personne du départ fait tout le trajet.
  const qui = a === z ? a : [a,z].map(x=> x || "à définir").join(" puis ");
  return `Anna${qui ? " avec " + qui : ""} : ${nom(t.de)} → ${nom(t.vers)}`;
}

/* Les commentaires du tableur, jour par jour, en note de l'évènement. Deux jours
   voisins portant le même commentaire sont réunis en une plage : sans cela, une
   semaine de vacances produirait sept lignes identiques. */
function notesDatees(jours){
  const plages = []; let cur = null;
  for(const d of jours){
    const c = (d.com||"").trim().replace(/ – /g, " · ");
    if(!c){ cur = null; continue; }
    if(cur && cur.com === c && jourNum(d.date) === jourNum(cur.fin)+1){ cur.fin = d.date; continue; }
    cur = {com:c, debut:d.date, fin:d.date};
    plages.push(cur);
  }
  return plages.map(p => p.debut === p.fin
    ? `${cap(libelleDate(p.debut))} : ${p.com}`
    : `Du ${libelleDate(p.debut)} au ${libelleDate(p.fin)} : ${p.com}`);
}

function evenementBloc(b){
  return evenement({
    debut:b.debut, fin:b.fin,
    lieu: lieuEvenement(b.ou),
    titre: titrePeriode(b),
    note: notesDatees(b.jours).join("\n"),
    cle:`p-${b.debut}-${b.fin}-${b.qui}-${b.ou}`});
}
/* Sur un trajet, un commentaire n'a d'intérêt que s'il parle du jour du voyage.
   « Vacances de la Toussaint », qui court sur deux semaines, ne dit rien du trajet ;
   « Toussaint (férié) », qui ne vaut que ce jour-là, si. On ne garde donc que les
   morceaux absents de la veille et du lendemain. */
function morceaux(d){
  return ((d && d.com) || "").replace(/ – /g, " · ").split(" · ")
    .map(x=>x.trim()).filter(Boolean);
}
function joursTrajetFiltres(t, parDate){
  const j = t.jours;
  const bords = new Set([
    ...morceaux(parDate[jourPlus(j[0].date, -1)]),
    ...morceaux(parDate[jourPlus(j[j.length-1].date, 1)]),
  ]);
  return j.map(d=>({date:d.date, com: morceaux(d).filter(m=> !bords.has(m)).join(" · ")}));
}
/* Pour le .ics, où l'évènement peut couvrir deux jours : chaque ligne datée. */
function notesTrajet(t, parDate){ return notesDatees(joursTrajetFiltres(t, parDate)); }
/* Pour la vignette, où la date est déjà en tête : les morceaux, sans la répéter. */
function comTrajet(t, parDate){
  const vus = [];
  for(const d of joursTrajetFiltres(t, parDate))
    for(const m of morceaux(d)) if(!vus.includes(m)) vus.push(m);
  return vus.join(" · ");
}

function evenementTrajet(t, parDate){
  // le titre dit déjà avec qui : la note ne le répète que s'il y a passation
  const lignes = [t.sens + (t.passation ? " · " + t.brute : "")];
  if(t.date2) lignes.push(`Départ possible le ${libelleDate(t.date)} ou le ${libelleDate(t.date2)}.`);
  lignes.push(...notesTrajet(t, parDate));
  return evenement({
    debut:t.date, fin:t.date2 || t.date,
    lieu: "",                    // un trajet n'a pas de lieu : il en relie deux
    titre: titreTrajet(t),
    note: lignes.filter(Boolean).join("\n"),
    cle:`t-${t.date}-${t.sens}-${t.de}-${t.vers}`});
}

function calendrier(elements, trajets, parDate, nomCal){
  const ev = elements.flatMap(e => trajets ? evenementTrajet(e, parDate) : evenementBloc(e));
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ou est Anna " + VERSION + "//FR",
             "CALSCALE:GREGORIAN","METHOD:PUBLISH",
             "X-WR-CALNAME:" + icsTexte(nomCal || "Où est Anna ?"),
             "X-PUBLISHED-TTL:PT6H", ...ev, "END:VCALENDAR"];
  return L.map(plier).join("\r\n") + "\r\n";
}

/* ------------------------------------------------------------------
   Point d'entrée commun : la page et le script passent tous deux par
   ici, et c'est ce qui garantit qu'ils voient le même planning.
   ------------------------------------------------------------------ */
function modele(days){
  const complets = grouper(days, function(d){ return d.qui+"|"+d.ou+"|"+(d.typ==="vacances"?"V":"S"); });
  const events   = grouper(days, function(d){ return d.qui+"|"+d.ou; }, notable);
  const parDate  = {};
  for(const d of days) parDate[d.date] = d;
  return {complets:complets, events:events, trajets:trajetsDepuis(complets), parDate:parDate};
}
/* Les trois vues de la barre « Périodes ». */
function vueDe(m, vue){
  if(vue === "trajets") return m.trajets;
  if(vue === "tout")    return m.complets;
  // Périodes de vacances entières, et week-ends et jours fériés hors vacances.
  return m.events.filter(function(b){ return b.types.has("vacances")
        || b.types.has("week-end") || b.types.has("férié"); });
}
/* « Tous les 3 », c'est aussi Raph et c'est aussi Marie. Qui coche l'un ou
   l'autre veut voir les moments où ils sont tous là : on élargit donc le filtre
   plutôt que de laisser ces périodes disparaître. L'inverse n'est pas vrai —
   cocher « Tous les 3 » ne fait pas apparaître les week-ends de l'un seul. */
function elargirQui(fQui){
  if(!fQui || !fQui.length) return fQui;
  const s = fQui.slice();
  if((s.indexOf("Raph") >= 0 || s.indexOf("Marie") >= 0) && s.indexOf("Tous les 3") < 0)
    s.push("Tous les 3");
  return s;
}
/* fQui et fOu : listes de catégories retenues ; vides = tout passe. */
function passeQuiOu(quis, ous, fQui, fOu){
  const q = elargirQui(fQui);
  if(q && q.length && !quis.some(x=> q.indexOf(categorieQui(x)) >= 0)) return false;
  if(fOu && fOu.length && !ous.some(o=> fOu.indexOf(categorieLieu(o)) >= 0)) return false;
  return true;
}
function filtrer(liste, trajets, fQui, fOu){
  return liste.filter(x=> passeQuiOu(trajets ? x.quis : [x.qui],
                                     trajets ? x.ous  : [x.ou], fQui, fOu));
}
/* Le nom du calendrier porte ses filtres : un abonnement oublié reste
   identifiable d'un coup d'œil dans la liste des calendriers. */
function nomCalendrier(vue, fQui, fOu){
  const quoi = vue === "trajets" ? "trajets"
             : vue === "tout"    ? "tout le planning"
             :                     "périodes";
  const f = [].concat(fQui || [], fOu || []);
  return "Anna — " + quoi + (f.length ? " (" + f.join(", ") + ")" : "");
}

/* Ce qui part au calendrier : la vue, moins ce qui reste à définir. */
function pourCalendrier(m, vue, fQui, fOu){
  const trajets = vue === "trajets";
  return filtrer(vueDe(m, vue), trajets, fQui, fOu).filter(x=> exportable(x, trajets));
}
/* >>> FIN LOGIQUE PARTAGÉE <<< */
function dateHeure(d){
  return d.toLocaleDateString("fr-FR") + " à " +
         d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
}
function aujourdhui(){
  const n=new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
}

/* ==================================================================
   3. FILTRES ET VUES
   ================================================================== */
const PERIODES = [
  {id:"tout",    lab:"Tout"},
  {id:"we-vac",  lab:"Week-ends & Vacances"},
  {id:"trajets", lab:"Trajets"},
];
const F_QUI = ["Raph","Marie","Tous les 3","Autres",NONDEF];
const F_QUI_LAB = {"Raph":"Raph","Marie":"Marie","Tous les 3":"Tous les 3",
                   "Autres":"Autres",[NONDEF]:NONDEF};
const F_OU  = ["Paris","Corenc","Autres",NONDEF];

const STATE = {today:"", periode:"we-vac", qui:new Set(), ou:new Set(),
               modele:null, premierRendu:true};

/* La barre « Périodes » nomme la vue par défaut « we-vac » ; le script, lui,
   l'appelle « evenements ». Une seule fonction pour traduire. */
function vueCourante(){ return STATE.periode === "we-vac" ? "evenements" : STATE.periode; }
function requete(){ const e=document.getElementById("q"); return e ? norm(e.value.trim()) : ""; }

/* Vue et filtres passent par le bloc partagé — le même que le script utilise
   pour fabriquer les abonnements. Seule la recherche reste ici : elle n'a de

}

/* ==================================================================
   3 bis. EXPORT VERS LE CALENDRIER (format iCalendar, RFC 5545)
   ================================================================== */
const ICONE_CAL = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18"
  height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13.5v5M9.5 16h5"/></svg>`;


let minuteurToast;
function bandeau(texte){
  document.querySelector(".toast")?.remove();
  clearTimeout(minuteurToast);
  const d = document.createElement("div");
  d.className = "toast";
  d.setAttribute("role", "status");
  d.innerHTML = `<p></p><button type="button" aria-label="Fermer">×</button>`;
  d.querySelector("p").textContent = texte.replace(/\s+/g, " ").trim();
  d.querySelector("button").addEventListener("click", ()=>d.remove());
  document.body.appendChild(d);
  minuteurToast = setTimeout(()=>d.remove(), 15000);
}

/* ==================================================================
   3 ter. ABONNEMENT — un calendrier qui se met à jour tout seul
   ------------------------------------------------------------------
   Un export est une photo ; un abonnement est un fil. Le lien pointe sur
   l'application web du tableur, avec les filtres courants inscrits dedans.
   Il ne bouge plus ensuite : c'est ce qui évite les doublons, puisqu'il
   n'y a jamais de raison de se réabonner — mais changer de filtres
   suppose donc de supprimer le calendrier et d'en ajouter un autre.
   ================================================================== */
const MEMO_ABO = "anna-abos";

function adresseAbo(){
  const base = adresseScript();
  const par = new URLSearchParams({c: vueCourante()});
  if(STATE.qui.size) par.set("qui", [...STATE.qui].join(","));
  if(STATE.ou.size)  par.set("ou",  [...STATE.ou].join(","));
  return base + (base.includes("?") ? "&" : "?") + par.toString();
}
/* Pas de webcal:// ici, et c'est un choix, pas un oubli : le Calendrier d'Apple
   traduit webcal:// par http:// — pas https — et Google refuse le http. L'essai
   se solde par « Connexion non sécurisée » puis « Échec de la validation ». On
   donne donc l'adresse https à copier, ce que tous les agendas acceptent. */

function memoAbos(){
  try{ return JSON.parse(localStorage.getItem(MEMO_ABO) || "[]"); }catch(e){ return []; }
}
function noterAbo(nom, url){
  const l = memoAbos().filter(x=> x.url !== url);
  l.unshift({nom, url, le: new Date().toISOString()});
  try{ localStorage.setItem(MEMO_ABO, JSON.stringify(l.slice(0,6))); }catch(e){}
}

/* Ce que l'abonné verra, en toutes lettres. Le but est qu'il ne découvre pas
   après coup que son calendrier ne montre qu'une partie du planning. */
/* Les intitulés des filtres sont faits pour des boutons, pas pour une phrase :
   « avec Autres » ou « à Paris ou Corenc » se lisent mal. On les retraduit. */
const DIT_QUI = {"Autres":"quelqu'un d'autre", "À définir":"une personne encore à définir"};
const DIT_OU  = {"Paris":"à Paris", "Corenc":"à Corenc",
                 "Autres":"ailleurs", "À définir":"dans un lieu encore à définir"};
function resumeAbo(){
  const vue = vueCourante();
  const quoi = vue === "trajets" ? "les trajets"
             : vue === "tout"    ? "tout le planning, semaines d'école comprises"
             :                     "les week-ends et les vacances";
  const f = [];
  if(STATE.qui.size)
    f.push("avec " + [...STATE.qui].map(q=> DIT_QUI[q] || q).join(" ou "));
  if(STATE.ou.size)
    f.push([...STATE.ou].map(o=> DIT_OU[o] || "à " + o).join(" ou "));
  return quoi + (f.length ? " " + f.join(", ") : "");
}

/* La marche à suivre dépend de l'agenda, et aucun ne se ressemble. On montre
   celle de l'appareil, les autres restent dépliables — un iPhone qui utilise
   Google Agenda n'est pas un cas rare. */
const MODES = [
  {id:"ios",  lab:"iPhone ou iPad", pas:[
    "Ouvrez l'application <b>Calendrier</b>.",
    "Onglet <b>Calendriers</b>, en bas de l'écran.",
    "<b>Ajouter un calendrier</b> → <b>Ajouter un calendrier avec abonnement</b>.",

function modeProbable(){
  const ua = navigator.userAgent;
  if(/iPad|iPhone|iPod/.test(ua) || (/Mac/.test(ua) && navigator.maxTouchPoints > 1)) return "ios";
  if(/Android/.test(ua)) return "goog";
  if(/Mac/.test(ua)) return "mac";
  return "goog";
}

async function versionDuScript(){
  try{
    const u = adresseScript();
    const r = await fetch(u + (u.includes("?") ? "&" : "?") + "v=1",
                          {redirect:"follow"});
    return (await r.text()).trim();
  }catch(e){ return null; }
}

function ligneBloc(b){
  const cl = classeQui(b.qui);
  const ici = b.debut<=STATE.today && STATE.today<=b.fin;
  const passe = b.fin < STATE.today ? " past" : "";
  const lieu = (b.ou && b.ou!==NONDEF)
      ? `<span class="at ${classeLieu(b.ou)}"> · ${esc(b.ou)}</span>`
      : `<span class="at" style="font-style:italic"> · lieu à définir</span>`;
  const nb = b.jours.length;
  const tag = ici ? `<span class="tag jour">Aujourd'hui</span>`
                  : (nb>1 ? `<span class="tag">${nb} j</span>` : "");
  return `<div class="row ${cl}${passe}${ici?" ici":""}"${ici?' id="ici"':""}>
    <div class="bar"></div>
    <div class="body">
      <p class="when">${esc(libellePeriode(b))}</p>
      <p class="who">${esc(LIBELLE[b.qui]||b.qui)}${lieu}</p>
      ${b.com?`<p class="note">${esc(b.com)}</p>`:""}
    </div>${tag}
  </div>`;
}

function ligneTrajet(t){
  const cl = t.couleur || classeQui(t.quis[t.quis.length-1]);
  const finT = t.date2 || t.date;
  const ici = t.date===STATE.today || finT===STATE.today;
  const passe = finT < STATE.today ? " past" : "";
  const nom = o => o===NONDEF
      ? `<span class="at" style="font-style:italic">lieu à définir</span>`
      : `<span class="at ${classeLieu(o)}">${esc(o)}</span>`;
  const quand = t.date2
      ? `${cap(libelleDate(t.date,true))} <span class="fleche">ou</span> ${libelleDate(t.date2,true)}`
      : esc(cap(libelleDate(t.date)));
  // seuls les commentaires propres au jour du trajet : voir joursTrajetFiltres
  const com = comTrajet(t, STATE.parDate);
  return `<div class="row ${cl}${passe}${ici?" ici":""}"${ici?' id="ici"':""}>
    <div class="bar"></div>
    <div class="body">
      <p class="when">${quand}</p>
      <p class="who">${nom(t.de)} <span class="fleche">→</span> ${nom(t.vers)}</p>
      <p class="note">${t.note}${com ? " · " + esc(com) : ""}</p>
    </div><span class="tag">${esc(t.sens)}</span>
  </div>`;
}

function parMois(items, dateDe, rendu){
  const m=new Map();
  for(const it of items){
    const {y,m:mo}=dparts(dateDe(it));
    const k=`${y}-${String(mo+1).padStart(2,"0")}`;
    if(!m.has(k)) m.set(k,[]);
    m.get(k).push(it);
  }
  let out="";
  for(const [k,list] of m){
    const [y,mo]=k.split("-").map(Number);
    out += `<p class="month">${cap(MOIS[mo-1])} ${y}</p><div class="list">${
      list.map(rendu).join("")}</div>`;
  }
  return out;
}

function renderList(){
  const l = elements();
  const res = document.getElementById("results");
  const trajets = STATE.periode === "trajets";
  majExport(l.filter(x=> exportable(x, trajets)).length, l.length, trajets);
  if(!l.length){
    res.innerHTML = `<p class="empty">Rien ne correspond à cette combinaison de filtres.</p>`;
    majSub(0);
    return;
  }
  res.innerHTML = parMois(l, trajets?(t=>t.date):(b=>b.debut), trajets?ligneTrajet:ligneBloc);
  majSub(l.length, trajets);
}

function majExport(n, total, trajets){
  const b = document.getElementById("abo"), note = document.getElementById("expnote");

    reste > 1 ? "n'y figureront pas" : "n'y figurera pas"}.`;

  const mot = trajets ? (n>1?"trajets":"trajet") : (n>1?"périodes":"période");

    `${n} ${mot} · du ${libelleDate(d[0].date).replace(/^\S+ /,"")} ${dparts(d[0].date).y}` +

/* ==================================================================
   5. COFFRE — mot de passe et déchiffrement de l'adresse du tableur
   PBKDF2-SHA256 (200 000 tours) pour dériver la clé, AES-GCM pour le
   contenu. Sans le mot de passe, le fichier ne contient rien d'exploitable.
   ================================================================== */
const CLE_STOCK = "anna-cle", JOURS_MEMOIRE = 30;
/* La réponse est tapée par des grands-parents : on l'aplatit avant de dériver la clé,
   pour que « Doudou », « doudou » et « le Doudou » ouvrent la même porte. */
function aplatir(s){
  return String(s).toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
}
function partsCoffre(c){
  const p = c.split(".");
  return p[0]==="v2" ? {iter:+p[1], sel:p[2], iv:p[3], txt:p[4]}
                     : {iter:200000, sel:p[1], iv:p[2], txt:p[3]};
}
const b64 = {
  enc: buf => btoa(String.fromCharCode(...new Uint8Array(buf))),
  dec: s => Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")), c=>c.charCodeAt(0)),
};
async function deriver(reponse, sel, iter){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(aplatir(reponse)),
                                             "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:sel, iterations:iter, hash:"SHA-256"},
                                 base, {name:"AES-GCM", length:256}, true, ["encrypt","decrypt"]);
}
/* Le coffre contient l'adresse du tableur et, éventuellement, celle du script,
   séparées par un saut de ligne. Un coffre d'avant cette version ne contient que
   la première : il continue de s'ouvrir sans rien changer. */
function repartir(clair){
  const [csv, script] = String(clair).split("\n");
  SCRIPT_DECHIFFRE = (script || "").trim();
  return (csv || "").trim();
}

async function ouvrir(coffre, cle){
  const p = partsCoffre(coffre);
  const clair = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64.dec(p.iv)}, cle, b64.dec(p.txt));
  return new TextDecoder().decode(clair);
}
async function cleMemorisee(){
  try{
    const raw = localStorage.getItem(CLE_STOCK);
    if(!raw) return null;
    const {k, exp} = JSON.parse(raw);
    if(Date.now() > exp){ localStorage.removeItem(CLE_STOCK); return null; }
    return await crypto.subtle.importKey("raw", b64.dec(k), {name:"AES-GCM"}, true, ["decrypt"]);
  }catch(e){ return null; }
}
async function memoriser(cle){
  try{
    const raw = await crypto.subtle.exportKey("raw", cle);
    localStorage.setItem(CLE_STOCK, JSON.stringify(
      {k:b64.enc(raw), exp: Date.now() + JOURS_MEMOIRE*86400000}));
  }catch(e){ /* navigation privée : on ne mémorise pas, sans conséquence */ }
}
function oublier(){
  try{ localStorage.removeItem(CLE_STOCK); }catch(e){}
  location.reload();
}

function demanderMotDePasse(erreurPrecedente){
  document.getElementById("sub").textContent = "Planning privé";
  document.getElementById("app").innerHTML = `<div class="porte">
    <p>Le planning d'Anna est réservé à la famille.</p>
    <label for="mdp">${QUESTION ? esc(QUESTION) : "Mot de passe"}</label>
    <input id="mdp" type="text" autocomplete="off" autocapitalize="none" spellcheck="false"
           enterkeyhint="go">
    <button class="bt" id="ok" type="button">Voir le planning</button>
    <p class="err" id="err">${erreurPrecedente||""}</p>
    <p style="margin:.2rem 0 0;font-size:.76rem;color:var(--ink-3)">
      Ni les accents, ni les majuscules, ni les espaces, ni la ponctuation ne comptent.
      Une fois trouvée, la réponse est retenue ${JOURS_MEMOIRE} jours sur cet appareil.</p>
  </div>`;
  const mdp=document.getElementById("mdp"), ok=document.getElementById("ok"), err=document.getElementById("err");
  const essayer = async () => {
    if(!mdp.value){ mdp.focus(); return; }
    ok.disabled=true; ok.textContent="Vérification…"; err.textContent="";
    try{
      const p = partsCoffre(COFFRE);
      const cle = await deriver(mdp.value, b64.dec(p.sel), p.iter);
      const url = repartir(await ouvrir(COFFRE, cle)); // échoue si le mot de passe est faux
      await memoriser(cle);
      charger([{nom:"tableur (adresse déchiffrée)", url}]);
    }catch(e){
      ok.disabled=false; ok.textContent="Voir le planning";
      err.textContent = QUESTION ? "Ce n'est pas la bonne réponse." : "Mot de passe incorrect.";
      mdp.select();
    }
  };
  ok.addEventListener("click", essayer);
  mdp.addEventListener("keydown", e=>{ if(e.key==="Enter") essayer(); });
  mdp.focus();
}

  const out=[];
  if(CSV_URL) out.push({nom:"tableur publié (CSV)", url:CSV_URL});
  if(s) out.push({nom:"tableur partagé (gviz)",
    url:`https://docs.google.com/spreadsheets/d/${s}/gviz/tq?tqx=out:csv&gid=${SHEET_GID}`});
  return out;
}
function panneau(titre, corps){
  document.getElementById("app").innerHTML = `<div class="msg"><h3>${titre}</h3>${corps}</div>`;
}
function setup(){
  document.getElementById("sub").textContent = "Page pas encore reliée au tableur";
  panneau("Il reste une étape",
    `Cette page lit le planning directement dans le tableur, mais l'adresse du tableur n'est pas encore renseignée.
     <ol><li>Ouvrir le tableur dans Google Sheets.</li>
     <li><strong>Fichier → Partager → Publier sur le web</strong>.</li>
     <li>Choisir l'onglet <strong>« Données web »</strong> et le format <strong>.csv</strong>, puis publier.</li>
     <li>Coller l'adresse obtenue dans <code>CSV_URL</code>, tout en haut du script de cette page.</li></ol>`);
}
function diagnostic(essais){
  const local = location.protocol === "file:";
  const detail = essais.map(e=>`<li><strong>${esc(e.nom)}</strong> — ${esc(e.err)}</li>`).join("");
  let corps = local
    ? `<p style="margin:0 0 .8rem">La page est ouverte <strong>directement depuis le disque</strong>
        (adresse en <code>file://</code>). Dans ce mode, le navigateur interdit à la page d'aller
        chercher des données sur internet — c'est une règle de sécurité, pas un défaut de la page.</p>
       <p style="margin:0 0 .8rem">Pour la tester pour de vrai, deux possibilités :</p>
       <ol><li>La mettre en ligne (GitHub Pages) et l'ouvrir depuis son adresse <code>https://…</code> ;</li>
       <li>ou, depuis le dossier qui contient le fichier, lancer <code>python3 -m http.server 8000</code>
       puis ouvrir <code>http://localhost:8000/index.html</code>.</li></ol>`
    : `<p style="margin:0 0 .8rem">Le tableur n'a pas répondu. Les causes les plus fréquentes :
        la publication sur le web n'est plus active, ou l'onglet publié n'est pas
        <strong>« Données web »</strong>.</p>`;
  corps += `<p style="margin:.9rem 0 .3rem;color:var(--ink-3);font-size:.8rem">Ce qui a été tenté :</p>
    <ul style="margin:0;padding-left:1.2rem;color:var(--ink-3);font-size:.8rem">${detail}</ul>
    <p style="margin:.9rem 0 0"><button id="retry" type="button"
      style="font:inherit;font-size:.85rem;padding:.4rem .8rem;border-radius:9px;cursor:pointer;
             border:1px solid var(--line);background:var(--card);color:var(--ink)">Réessayer</button></p>`;
  panneau("Le planning n'a pas pu être chargé", corps);
  document.getElementById("retry").addEventListener("click", go);
}

async function charger(liste){
  if(!liste.length){ setup(); return; }
  document.getElementById("sub").textContent = "Chargement du planning…";
  document.getElementById("maj").textContent = "";
  const essais=[];
  for(const src of liste){
    try{
      const r = await fetch(src.url, {cache:"no-store"});
      if(!r.ok) throw new Error("réponse HTTP "+r.status);
      const {days, maj} = toObjects(parseCSV(await r.text()));
      // Priorité à la colonne « Mise à jour » du tableur. À défaut, l'en-tête HTTP
      // « Last-Modified » — que Google n'envoie pas toujours, d'où le repli silencieux.
      STATE.majSource = maj || litDate(r.headers.get("Last-Modified"));
      if(!days.length) throw new Error("aucune ligne exploitable dans la réponse");
      days.sort((a,b)=>a.date<b.date?-1:1);
      rendre(days);
      return;
    }catch(e){
      essais.push({nom:src.nom, err:/fetch/i.test(e.message)
        ? "pas de réponse (blocage réseau ou publication inactive)" : e.message});
    }
  }
  document.getElementById("sub").textContent = "Planning momentanément indisponible";
  document.getElementById("maj").textContent = "";
  diagnostic(essais);
}

async function go(){
  if(COFFRE && !P.get("csv")){
    if(!window.crypto || !crypto.subtle){
      panneau("Page à ouvrir en ligne",
        `Le déverrouillage a besoin d'une connexion sécurisée. Ouvrez cette page depuis son
         adresse <code>https://…</code> plutôt que depuis le disque.`);
      return;
    }
    const cle = await cleMemorisee();
    if(cle){
      try{ return charger([{nom:"tableur (adresse déchiffrée)",
                            url: repartir(await ouvrir(COFFRE, cle))}]); }
      catch(e){ try{ localStorage.removeItem(CLE_STOCK); }catch(_){} }
    }
    return demanderMotDePasse();
  }
  return charger(sources());
}
go();
</script>
