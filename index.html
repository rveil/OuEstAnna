<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Où est Anna ?</title>
<meta name="description" content="Le planning d'Anna, tenu à jour par Marie et Raph.">
<meta name="color-scheme" content="light dark">
<style>
/* ================================================================
   PALETTE
   ================================================================ */
:root{
  --bg:#f6f6f4; --card:#ffffff; --ink:#1b1b19; --ink-2:#5c5c56; --ink-3:#8c8c84;
  --line:#e3e3dd; --line-2:#eeeee8; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.14);
  --marie:#1b5fa8; --raph:#bf2318; --tous:#7a2e9e; --gp:#2f7a4d; --def:#7a7a72;
  --marie-bg:#e7f0fa; --raph-bg:#fbebe9; --tous-bg:#f3eafa; --gp-bg:#e8f3ec; --def-bg:#efefea;
  --lieu-base:#0e8fa0; --lieu-paris:#c2700a; --lieu-out:#c4147a;
  --accent:#1b1b19;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121211; --card:#1c1c1a; --ink:#f0f0ec; --ink-2:#a8a8a0; --ink-3:#7a7a72;
    --line:#2e2e2b; --line-2:#262624; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    --marie:#79b4f0; --raph:#f0857a; --tous:#c79ae8; --gp:#5cc98a; --def:#9a9a92;
    --marie-bg:#16263a; --raph-bg:#33201d; --tous-bg:#281a33; --gp-bg:#152a1f; --def-bg:#262623;
    --lieu-base:#4fc3d4; --lieu-paris:#e5a463; --lieu-out:#f37ac0;
    --accent:#f0f0ec;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:400 16px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:0 0 4rem;
}
.wrap{max-width:44rem;margin:0 auto;padding:0 1rem}

/* ---------------- en-tête ---------------- */
header{padding:2.5rem 0 1.25rem}
h1{font-size:1.5rem;line-height:1.15;letter-spacing:-.02em;margin:0 0 .3rem;font-weight:650}
.sub{color:var(--ink-3);font-size:.82rem;margin:0}

/* ---------------- carte "maintenant" ---------------- */
.now{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:1.15rem 1.25rem;box-shadow:var(--shadow);margin:0 0 2rem;
}
.now .lab{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 .5rem}
.now .who{font-size:1.5rem;font-weight:650;letter-spacing:-.02em;margin:0;line-height:1.2}
.now .where{font-size:1rem;color:var(--ink-2);margin:.15rem 0 0}
.now .note{font-size:.85rem;color:var(--ink-3);margin:.55rem 0 0;font-style:italic}
.now .until{font-size:.8rem;color:var(--ink-3);margin:.6rem 0 0;padding-top:.6rem;border-top:1px solid var(--line-2)}

/* ---------------- sections ---------------- */
h2{
  font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;margin:2.2rem 0 .7rem;
}
h2:first-of-type{margin-top:0}

/* ---------------- lignes ---------------- */
.list{display:flex;flex-direction:column;gap:.4rem}
.row{
  display:flex;gap:.85rem;align-items:flex-start;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:.7rem .85rem;
}
.row.past{opacity:.45}
.row .bar{width:3px;border-radius:3px;align-self:stretch;flex:0 0 3px;background:var(--def)}
.row .body{flex:1;min-width:0}
.row .when{font-size:.78rem;color:var(--ink-3);margin:0 0 .1rem;font-variant-numeric:tabular-nums}
.row .who{font-size:1rem;font-weight:600;margin:0;letter-spacing:-.01em}
.row .who .at{font-weight:400;color:var(--ink-2)}
.at-base{color:var(--lieu-base)!important}
.at-paris{color:var(--lieu-paris)!important}
.at-out{color:var(--lieu-out)!important}
.m-def .who,.m-def .tag,.legend .m-def{font-style:italic}
.row .note{font-size:.8rem;color:var(--ink-3);margin:.2rem 0 0}
.tag{
  flex:0 0 auto;font-size:.66rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  padding:.2rem .45rem;border-radius:6px;align-self:center;white-space:nowrap;
}
.m-marie{--c:var(--marie);--cb:var(--marie-bg)}
.m-raph{--c:var(--raph);--cb:var(--raph-bg)}
.m-tous{--c:var(--tous);--cb:var(--tous-bg)}
.m-gp{--c:var(--gp);--cb:var(--gp-bg)}
.m-def{--c:var(--def);--cb:var(--def-bg)}
.row .bar{background:var(--c,var(--def))}
.row .who{color:var(--c,var(--ink))}
.tag{background:var(--cb,var(--def-bg));color:var(--c,var(--def))}

/* ---------------- recherche ---------------- */
.tools{margin:0 0 1.5rem}
.search{position:relative;margin:0 0 .55rem}
.search input{
  width:100%;font:inherit;font-size:1rem;padding:.62rem .8rem .62rem 2.25rem;
  background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:11px;
  -webkit-appearance:none;appearance:none;
}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:none;border-color:var(--ink-3)}
.search svg{position:absolute;left:.72rem;top:50%;transform:translateY(-50%);
  width:.95rem;height:.95rem;stroke:var(--ink-3);fill:none;stroke-width:2;pointer-events:none}
.search button{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);
  border:0;background:var(--line-2);color:var(--ink-2);border-radius:50%;
  width:1.45rem;height:1.45rem;font-size:.95rem;line-height:1;cursor:pointer;padding:0}
.chips{display:flex;gap:.35rem;overflow-x:auto;padding-bottom:.2rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{
  flex:0 0 auto;font:inherit;font-size:.78rem;padding:.32rem .68rem;border-radius:999px;
  cursor:pointer;background:var(--card);border:1px solid var(--line);color:var(--ink-2);
}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{color:var(--ink-3);font-size:.88rem;padding:1.1rem 0;margin:0}

/* ---------------- mois ---------------- */
.month{margin:1.6rem 0 .5rem;font-size:.95rem;font-weight:650;letter-spacing:-.01em}
details>summary{
  cursor:pointer;list-style:none;font-size:.8rem;color:var(--ink-3);
  padding:.55rem 0;user-select:none;
}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
details[open]>summary::before{content:"▾ "}

/* ---------------- pied ---------------- */
footer{margin-top:2.5rem;padding-top:1.2rem;border-top:1px solid var(--line);
  font-size:.75rem;color:var(--ink-3);line-height:1.6}
.legend{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 .9rem}
.legend span{font-size:.68rem;font-weight:600;padding:.2rem .45rem;border-radius:6px}

/* ---------------- états ---------------- */
.msg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.25rem;
  font-size:.88rem;line-height:1.65;color:var(--ink-2)}
.msg h3{margin:0 0 .6rem;font-size:.95rem;color:var(--ink)}
.msg code{background:var(--line-2);padding:.1rem .3rem;border-radius:4px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82em;word-break:break-all}
.msg ol{margin:.5rem 0 0;padding-left:1.2rem} .msg li{margin:.35rem 0}
.skel{height:1rem;background:var(--line-2);border-radius:5px;animation:p 1.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.5}50%{opacity:.9}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Où est Anna&nbsp;?</h1>
  <p class="sub" id="sub">Chargement du planning…</p>
</header>

<main id="app">
  <div class="now"><div class="skel" style="width:40%;margin-bottom:.7rem"></div>
    <div class="skel" style="width:70%;height:1.6rem"></div></div>
</main>

<footer>
  <div class="legend" id="legend"></div>
  <div id="foot"></div>
</footer>

</div>
<script>
/* ==================================================================
   1. CONFIGURATION — la seule ligne à modifier
   ==================================================================
   Collez ici l'adresse CSV publiée de l'onglet « Données web ».
   Dans Google Sheets : Fichier → Partager → Publier sur le web
     · Onglet à publier : « Données web »
     · Format : Valeurs séparées par des virgules (.csv)
   Puis copiez l'adresse obtenue entre les guillemets ci-dessous.
   ================================================================== */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSq70Ble2mZGcGvPZ8ecVqAaiYPQaF1ZIky_UbYt246_VBD-6bkQzUhB3jCkqbhKVvG7VMNAjOWH2gN/pub?gid=1504266455&single=true&output=csv";

/* Secours : identifiant du tableur tel qu'il apparaît dans l'adresse d'édition
   https://docs.google.com/spreadsheets/d/CET_IDENTIFIANT/edit#gid=1504266455
   Il sert à interroger Google par une seconde voie (gviz) si la première échoue.
   Le tableur doit alors être partagé en « Tout utilisateur disposant du lien — Lecteur ». */
const SHEET_ID = "";
const SHEET_GID = "1504266455";

/* ------------------------------------------------------------------ */
const P = new URLSearchParams(location.search);
const URL_CSV = P.get("csv") || CSV_URL;

const JOURS = {lun:"lundi",mar:"mardi",mer:"mercredi",jeu:"jeudi",ven:"vendredi",sam:"samedi",dim:"dimanche"};
const JOURS_C = {lun:"lun",mar:"mar",mer:"mer",jeu:"jeu",ven:"ven",sam:"sam",dim:"dim"};
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MOIS_C = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];

const CLASSE = {
  "Marie":"m-marie", "Raph":"m-raph", "Tous les 3":"m-tous", "Autres":"m-gp", "À définir":"m-def"
};
const LIBELLE = {
  "Marie":"Avec Marie", "Raph":"Avec Raph", "Tous les 3":"Tous les 3",
  "Autres":"Autres", "À définir":"À définir"
};
const BASE = "Corenc", PARIS = "Paris", NONDEF = "À définir";
function classeLieu(o){
  if(!o || o===NONDEF) return "";
  if(o===BASE) return "at-base";
  if(o===PARIS) return "at-paris";
  return "at-out";
}

/* ---------- CSV ---------- */
function parseCSV(t){
  t = t.replace(/^﻿/,"");
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){
      if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else if(c==='"') q=true;
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else if(c!=="\r") cur+=c;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(v=>v.trim()!==""));
}

function toObjects(rows){
  const h = rows[0].map(s=>s.trim());
  const ix = n => h.indexOf(n);
  const iD=ix("Date"), iJ=ix("Jour"), iQ=ix("Avec qui ?"), iO=ix("Où ça ?"),
        iC=ix("Commentaire"), iT=ix("Type");
  if(iD<0||iQ<0) throw new Error("colonnes introuvables");
  return rows.slice(1).map(r=>({
    date:(r[iD]||"").trim(),
    jour:(r[iJ]||"").trim(),
    qui:(r[iQ]||"").trim(),
    ou:(r[iO]||"").trim(),
    com:(r[iC]||"").trim(),
    typ:(r[iT]||"").trim()
  })).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d.date));
}

/* ---------- regroupement ---------- */
// Un jour est "notable" s'il sort de l'ordinaire (école, chez Marie, à Corenc).
function notable(d){
  if(d.typ !== "classe") return true;                    // week-end, vacances, jour férié
  if(d.qui === NONDEF && d.ou === NONDEF) return false;  // jour d'école pas encore renseigné
  return d.qui !== "Marie" || d.ou !== BASE;             // jour d'école qui sort de l'ordinaire
}
function jourNum(s){ return Math.round(Date.parse(s+"T12:00:00Z")/86400000); }

function grouper(days){
  const out=[]; let cur=null;
  const ajouteNotes = (b,com) => {
    if(!com) return;
    for(const part of com.split(" \u2013 ")){
      const t = part.trim();
      if(t && !b.notes.includes(t)) b.notes.push(t);
    }
  };
  for(const d of days){
    if(!notable(d)){ cur=null; continue; }
    const key = d.qui+"|"+d.ou;
    if(cur && cur.key===key && jourNum(d.date)===jourNum(cur.fin)+1){
      cur.fin = d.date; cur.jours.push(d); ajouteNotes(cur,d.com);
    } else {
      cur = {key, qui:d.qui, ou:d.ou, notes:[], debut:d.date, fin:d.date, jours:[d]};
      ajouteNotes(cur,d.com);
      out.push(cur);
    }
  }
  for(const b of out){
    // sur une periode de plusieurs jours, le nom du ferie est du bruit ; seul le fond compte
    let n = b.jours.length>1 ? b.notes.filter(t=>!/\(férié\)$/.test(t)) : b.notes;
    b.notesToutes = b.notes;
    b.com = n.slice(0,3).join(" \u00b7 ") + (n.length>3 ? " \u00b7 …" : "");
  }
  return out;
}

/* ---------- dates ---------- */
function dparts(s){ const [y,m,j]=s.split("-").map(Number); return {y,m:m-1,j}; }
function libelleDate(s,court){
  const {y,m,j}=dparts(s);
  const jj = new Date(Date.UTC(y,m,j)).getUTCDay();
  const noms = ["dim","lun","mar","mer","jeu","ven","sam"];
  const jn = court ? noms[jj] : JOURS[noms[jj]];
  return `${jn} ${j===1?"1er":j} ${court?MOIS_C[m]:MOIS[m]}`;
}
function libellePeriode(b){
  const a=dparts(b.debut), z=dparts(b.fin);
  if(b.debut===b.fin) return cap(libelleDate(b.debut));
  const g = cap(libelleDate(b.debut,true));
  const d = libelleDate(b.fin,true);
  const an = (z.y!==a.y) ? " "+z.y : "";
  return `${g} → ${d}${an}`;
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function aujourdhui(){
  const n=new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
}

/* ---------- rendu ---------- */
function ligne(b, today){
  const cl = CLASSE[b.qui] || "m-def";
  const passe = b.fin < today ? " past" : "";
  const lieu = (b.ou && b.ou!==NONDEF)
      ? `<span class="at ${classeLieu(b.ou)}"> · ${esc(b.ou)}</span>`
      : `<span class="at" style="font-style:italic"> · lieu à définir</span>`;
  const note = b.com ? `<p class="note">${esc(b.com)}</p>` : "";
  const nb = b.jours.length;
  const tag = nb>1 ? `<span class="tag">${nb} j</span>` : "";
  return `<div class="row ${cl}${passe}">
    <div class="bar"></div>
    <div class="body">
      <p class="when">${esc(libellePeriode(b))}</p>
      <p class="who">${esc(LIBELLE[b.qui]||b.qui)}${lieu}</p>
      ${note}
    </div>${tag}
  </div>`;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }

const STATE = {blocs:[], today:"", chip:""};

function hayFor(b){
  const a=dparts(b.debut), z=dparts(b.fin);
  const parts=[LIBELLE[b.qui]||b.qui, b.qui, b.ou, (b.notesToutes||[]).join(" "), libellePeriode(b),
               MOIS[a.m]+" "+a.y, MOIS[z.m]+" "+z.y];
  for(const d of b.jours){ parts.push(d.typ, JOURS[d.jour]||d.jour); }
  if(b.ou===NONDEF) parts.push("lieu a definir");
  return norm(parts.join(" "));
}

function parMoisHTML(blocs, today){
  const parMois=new Map();
  for(const b of blocs){
    const {y,m}=dparts(b.debut);
    const k=`${y}-${String(m+1).padStart(2,"0")}`;
    if(!parMois.has(k)) parMois.set(k,[]);
    parMois.get(k).push(b);
  }
  let out="";
  for(const [k,bs] of parMois){
    const [y,m]=k.split("-").map(Number);
    out += `<p class="month">${cap(MOIS[m-1])} ${y}</p><div class="list">${
      bs.map(b=>ligne(b,today)).join("")}</div>`;
  }
  return out;
}

function filtrer(){
  const q = norm(document.getElementById("q").value.trim());
  const f = STATE.chip;
  return STATE.blocs.filter(b=>{
    if((f==="Marie"||f==="Raph") && b.qui!==f) return false;
    if(f==="vacances" && !b.types.has("vacances")) return false;
    if(f==="weekend" && (b.types.has("vacances") || !b.types.has("week-end"))) return false;
    if(q && !b.hay.includes(q)) return false;
    return true;
  });
}

function renderList(){
  const today = STATE.today;
  const q = document.getElementById("q").value.trim();
  const res = document.getElementById("results");
  if(!q && !STATE.chip){
    const prochains = STATE.blocs.filter(b=>b.debut>today).slice(0,8)
                        .map(b=>ligne(b,today)).join("");
    res.innerHTML = (prochains?`<h2>À venir</h2><div class="list">${prochains}</div>`:"")
      + `<details><summary>Voir tout le planning</summary>${parMoisHTML(STATE.blocs,today)}</details>`;
    return;
  }
  const l = filtrer();
  res.innerHTML = `<h2>${l.length} résultat${l.length>1?"s":""}</h2>`
    + (l.length ? parMoisHTML(l,today)
       : `<p class="empty">Rien ne correspond. Essayez « Noël », « Paris », « ski », « mars 2027 »…</p>`);
}

function initTools(){
  const q=document.getElementById("q"), clear=document.getElementById("clear");
  const maj=()=>{ clear.hidden = !q.value; renderList(); };
  q.addEventListener("input", maj);
  q.addEventListener("keydown", e=>{ if(e.key==="Escape"){ q.value=""; maj(); } });
  clear.addEventListener("click", ()=>{ q.value=""; maj(); q.focus(); });
  const chips=[...document.querySelectorAll(".chips button")];
  for(const btn of chips) btn.addEventListener("click", ()=>{
    STATE.chip = (STATE.chip===btn.dataset.f) ? "" : btn.dataset.f;
    for(const b of chips) b.classList.toggle("on", (b.dataset.f||"")===STATE.chip);
    renderList();
  });
}

function carteNow(days){
  const today=STATE.today, blocs=STATE.blocs;
  const enCours = blocs.find(b=> b.debut<=today && today<=b.fin);
  const suivant = blocs.find(b=> b.debut>today);
  if(enCours){
    const reste = jourNum(enCours.fin)-jourNum(today);
    return `<div class="now ${CLASSE[enCours.qui]||"m-def"}">
      <p class="lab">En ce moment</p>
      <p class="who" style="color:var(--c)">${esc(LIBELLE[enCours.qui]||enCours.qui)}</p>
      <p class="where ${classeLieu(enCours.ou)}"${enCours.ou===NONDEF?' style="font-style:italic"':''}>${
        esc(enCours.ou && enCours.ou!==NONDEF ? enCours.ou : "lieu à définir")}</p>
      ${enCours.com?`<p class="note">${esc(enCours.com)}</p>`:""}
      <p class="until">${reste===0?"Jusqu'à ce soir":"Jusqu'au "+libelleDate(enCours.fin)}${
        suivant?` · ensuite ${esc(LIBELLE[suivant.qui]||suivant.qui)}${
          suivant.ou&&suivant.ou!==NONDEF?" à "+esc(suivant.ou):""}, ${esc(libellePeriode(suivant))}`:""
      }</p></div>`;
  }
  const avant = today < days[0].date, apres = today > days[days.length-1].date;
  const cl = apres ? "m-def" : (suivant ? (CLASSE[suivant.qui]||"m-def") : "m-marie");
  const titre = avant ? "Le planning n'a pas encore commencé"
              : apres ? "Le planning s'arrête ici" : "Semaine d'école";
  const sous  = avant ? "Il démarre le "+libelleDate(days[0].date)
              : apres ? "À prolonger avec l'année scolaire suivante" : "Chez Marie, à Corenc";
  return `<div class="now ${cl}">
    <p class="lab">Aujourd'hui</p>
    <p class="who" style="color:var(--c)">${esc(titre)}</p>
    <p class="where">${esc(sous)}</p>
    ${suivant?`<p class="until">${avant?"Première période":"Prochain changement"} : ${
      esc(LIBELLE[suivant.qui]||suivant.qui)}${
      suivant.ou&&suivant.ou!==NONDEF?" à "+esc(suivant.ou):""}, ${esc(libellePeriode(suivant))}</p>`:""}
  </div>`;
}

function rendre(days){
  STATE.today = aujourdhui();
  STATE.blocs = grouper(days);
  for(const b of STATE.blocs){
    b.types = new Set(b.jours.map(d=>d.typ));
    b.hay = hayFor(b);
  }

  document.getElementById("app").innerHTML = carteNow(days) + `
    <div class="tools">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" autocomplete="off" enterkeyhint="search"
               placeholder="Rechercher : Noël, Paris, ski, mars 2027…" aria-label="Rechercher une période">
        <button id="clear" type="button" hidden aria-label="Effacer">×</button>
      </div>
      <div class="chips">
        <button data-f="" class="on">Tout</button>
        <button data-f="Marie">Avec Marie</button>
        <button data-f="Raph">Avec Raph</button>
        <button data-f="vacances">Vacances</button>
        <button data-f="weekend">Week-ends</button>
      </div>
    </div>
    <div id="results"></div>`;

  initTools();
  renderList();

  document.getElementById("legend").innerHTML = Object.keys(CLASSE).map(q=>
    `<span class="${CLASSE[q]}" style="background:var(--cb);color:var(--c)">${esc(LIBELLE[q])}</span>`).join("");
  const maj = new Date();
  document.getElementById("foot").innerHTML =
    `Les week-ends, vacances et jours fériés uniquement — les semaines d'école ordinaires (chez Marie, à Corenc) ne sont pas listées.<br>
     Planning tenu à jour par Marie et Raph. Page actualisée le ${maj.toLocaleDateString("fr-FR")} à ${maj.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}.`;
  document.getElementById("sub").textContent =
    `${STATE.blocs.length} périodes · du ${libelleDate(days[0].date).replace(/^\S+ /,"")} ${dparts(days[0].date).y} au ${libelleDate(days[days.length-1].date).replace(/^\S+ /,"")} ${dparts(days[days.length-1].date).y}`;
}

/* ---------- démarrage ---------- */
function sources(){
  const q = P.get("csv");
  if(q) return [{nom:"adresse passée en paramètre", url:q}];
  const s = P.get("sheet") || SHEET_ID;
  const out = [];
  if(CSV_URL) out.push({nom:"tableur publié (CSV)", url:CSV_URL});
  if(s) out.push({nom:"tableur partagé (gviz)",
    url:`https://docs.google.com/spreadsheets/d/${s}/gviz/tq?tqx=out:csv&gid=${SHEET_GID}`});
  return out;
}

function panneau(titre, corps){
  document.getElementById("app").innerHTML =
    `<div class="msg"><h3>${titre}</h3>${corps}</div>`;
}

function diagnostic(essais){
  const local = location.protocol === "file:";
  const detail = essais.map(e=>`<li><strong>${esc(e.nom)}</strong> — ${esc(e.err)}</li>`).join("");
  let corps = "";
  if(local){
    corps += `<p style="margin:0 0 .8rem">La page est ouverte <strong>directement depuis le disque</strong>
      (adresse en <code>file://</code>). Dans ce mode, le navigateur interdit à la page d'aller
      chercher des données sur internet — c'est une règle de sécurité, pas un défaut de la page.</p>
      <p style="margin:0 0 .8rem">Pour la tester pour de vrai, deux possibilités :</p>
      <ol>
        <li>La mettre en ligne (GitHub Pages) et l'ouvrir depuis son adresse <code>https://…</code> ;</li>
        <li>ou, depuis le dossier qui contient le fichier, lancer
          <code>python3 -m http.server 8000</code> puis ouvrir
          <code>http://localhost:8000/index.html</code>.</li>
      </ol>`;
  } else {
    corps += `<p style="margin:0 0 .8rem">Le tableur n'a pas répondu. Les causes les plus fréquentes :
      la publication sur le web n'est plus active, ou l'onglet publié n'est pas
      <strong>« Données web »</strong>.</p>`;
  }
  corps += `<p style="margin:.9rem 0 .3rem;color:var(--ink-3);font-size:.8rem">Ce qui a été tenté :</p>
    <ul style="margin:0;padding-left:1.2rem;color:var(--ink-3);font-size:.8rem">${detail}</ul>
    <p style="margin:.9rem 0 0"><button id="retry" type="button"
      style="font:inherit;font-size:.85rem;padding:.4rem .8rem;border-radius:9px;cursor:pointer;
             border:1px solid var(--line);background:var(--card);color:var(--ink)">Réessayer</button></p>`;
  panneau("Le planning n'a pas pu être chargé", corps);
  document.getElementById("retry").addEventListener("click", go);
}

async function go(){
  const liste = sources();
  if(!liste.length){ setup(); return; }
  document.getElementById("sub").textContent = "Chargement du planning…";
  const essais = [];
  for(const src of liste){
    try{
      const r = await fetch(src.url, {cache:"no-store"});
      if(!r.ok) throw new Error("réponse HTTP " + r.status);
      const days = toObjects(parseCSV(await r.text()));
      if(!days.length) throw new Error("aucune ligne exploitable dans la réponse");
      days.sort((a,b)=>a.date<b.date?-1:1);
      rendre(days);
      return;
    }catch(e){
      const m = /fetch/i.test(e.message)
        ? "pas de réponse (blocage réseau ou publication inactive)" : e.message;
      essais.push({nom:src.nom, err:m});
    }
  }
  document.getElementById("sub").textContent = "Planning momentanément indisponible";
  diagnostic(essais);
}
go();
</script>
